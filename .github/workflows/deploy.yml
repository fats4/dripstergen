name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub also runs "pages build and deployment" (raw repo). Re-deploy dist/ after it.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GH_PAGES: "true"
          # "/" for custom domain at root; "/dripstergen/" for *.github.io/dripstergen/
          GH_PAGES_BASE: ${{ vars.GH_PAGES_BASE || '/' }}
          VITE_ASSETS_BASE_URL: ${{ secrets.VITE_ASSETS_BASE_URL }}
          VITE_IPFS_CID: ${{ secrets.VITE_IPFS_CID }}
          VITE_IPFS_GATEWAY: ${{ secrets.VITE_IPFS_GATEWAY }}
          VITE_ENABLE_MONIGGA_COLLAB: "true"
          VITE_ENABLE_ROARNADS_STICKERS: "true"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Bake trait catalog into dist (same-origin, no R2 CORS on JSON)
        env:
          VITE_ASSETS_BASE_URL: ${{ secrets.VITE_ASSETS_BASE_URL }}
        run: |
          if [ -z "$VITE_ASSETS_BASE_URL" ]; then echo "skip catalog bake"; exit 0; fi
          mkdir -p dist/traits
          curl -fsSL "$VITE_ASSETS_BASE_URL/traits/_scan.json" -o dist/traits/_scan.json
          curl -fsSL "$VITE_ASSETS_BASE_URL/traits/_collab.json" -o dist/traits/_collab.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('dist/traits/_scan.json','utf8'));fs.writeFileSync('dist/traits/_monigga-stickers.json',JSON.stringify(s.monigga??[])+'\n');fs.writeFileSync('dist/traits/_roarnads-stickers.json',JSON.stringify(s.roarnads??[])+'\n');"
          node -e "const j=require('./dist/traits/_scan.json');console.log('catalog',Object.fromEntries(Object.entries(j).map(([k,v])=>[k,v.length])), 'monigga', (j.monigga??[]).length, 'roarnads', (j.roarnads??[]).length)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploy (attempt 2)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4

      - name: Fail if all deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1

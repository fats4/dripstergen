name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub also runs "pages build and deployment" (raw repo). Re-deploy dist/ after it.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GH_PAGES: "true"
          # "/" for custom domain at root; "/dripstergen/" for *.github.io/dripstergen/
          GH_PAGES_BASE: ${{ vars.GH_PAGES_BASE || '/' }}
          VITE_ASSETS_BASE_URL: ${{ secrets.VITE_ASSETS_BASE_URL }}
          VITE_IPFS_CID: ${{ secrets.VITE_IPFS_CID }}
          VITE_IPFS_GATEWAY: ${{ secrets.VITE_IPFS_GATEWAY }}

      - name: Verify export service worker in dist
        env:
          VITE_ASSETS_BASE_URL: ${{ secrets.VITE_ASSETS_BASE_URL }}
        run: |
          if [ -z "$VITE_ASSETS_BASE_URL" ]; then echo "skip sw check"; exit 0; fi
          test -f dist/traits-sw.json
          node -e "const m=require('./dist/traits-sw.json');const fs=require('fs');if(!fs.existsSync('dist/'+m.url))process.exit(1);console.log('export sw',m.url)"

      - name: Bake trait catalog into dist (same-origin, no R2 CORS on JSON)
        env:
          VITE_ASSETS_BASE_URL: ${{ secrets.VITE_ASSETS_BASE_URL }}
        run: |
          if [ -z "$VITE_ASSETS_BASE_URL" ]; then echo "skip catalog bake"; exit 0; fi
          mkdir -p dist/traits
          curl -fsSL "$VITE_ASSETS_BASE_URL/traits/_scan.json" -o dist/traits/_scan.json
          node -e "const j=require('./dist/traits/_scan.json');console.log('catalog',Object.fromEntries(Object.entries(j).map(([k,v])=>[k,v.length])))"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
